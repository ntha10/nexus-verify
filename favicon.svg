<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="NEXUS">
  <!--
    The NEXUS mark, same geometry as src/ui/layout/BrandMark.tsx so the tab icon and the
    topbar logo are one drawing: two hollow upstream steps feeding one filled junction.
    `currentColor` there becomes the literal brand orange here — a favicon has no
    inherited colour — and the 1.14 scale is the only change, buying back the padding a
    16px tab strip would otherwise waste.
  -->
  <g transform="translate(12 12) scale(1.14) translate(-12 -12)">
    <path
      d="M7.4 7.2 L15.2 11.1 M7.4 16.8 L15.2 12.9"
      stroke="#ff4f00"
      stroke-width="1.7"
      stroke-linecap="round"
      opacity="0.55"
    />
    <circle cx="5.6" cy="6.4" r="2.1" stroke="#ff4f00" stroke-width="1.7" />
    <circle cx="5.6" cy="17.6" r="2.1" stroke="#ff4f00" stroke-width="1.7" />
    <circle cx="17.6" cy="12" r="3.1" fill="#ff4f00" />
  </g>
</svg>
